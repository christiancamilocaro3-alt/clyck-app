<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLYCK · Panel administrativo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7f8;color:#15251f}
header{background:#0d2b24;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{font-size:26px;font-weight:900;letter-spacing:.5px}.sub{opacity:.72;font-size:13px;margin-top:3px}
main{max-width:1200px;margin:28px auto;padding:0 18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.card{background:white;border:1px solid #e5e9e7;border-radius:16px;padding:18px;box-shadow:0 5px 20px #00000008}
.label{font-size:12px;color:#64736e;text-transform:uppercase;letter-spacing:.6px}.num{font-size:30px;font-weight:850;margin-top:5px}
.panel{background:white;border:1px solid #e5e9e7;border-radius:16px;padding:18px;margin-bottom:20px}
h2{font-size:18px;margin:0 0 14px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,button{font:inherit}input{padding:11px 13px;border:1px solid #d5ddda;border-radius:10px;min-width:240px}button{padding:11px 15px;border:0;border-radius:10px;background:#0d2b24;color:#fff;font-weight:700;cursor:pointer}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0ef;font-size:13px}th{font-size:11px;color:#687771;text-transform:uppercase}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef5f2;font-weight:700;font-size:11px}.empty{padding:25px;text-align:center;color:#74827e}
.status{margin:8px 0 14px;font-size:13px;color:#5d6c67}.error{color:#a12727;background:#fff0f0;padding:10px;border-radius:10px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div><div class="logo">CLYCK</div><div class="sub">Panel administrativo · MVP Vino de Iguaraya</div></div><div class="sub">Conecta. Toca. Resuelve.</div></header>
<main>
<section class="cards">
<div class="card"><div class="label">Botellas</div><div class="num" id="nBotellas">—</div></div>
<div class="card"><div class="label">Asociadas</div><div class="num" id="nAsociadas">—</div></div>
<div class="card"><div class="label">Interacciones</div><div class="num" id="nInteracciones">—</div></div>
<div class="card"><div class="label">Devoluciones</div><div class="num" id="nDevoluciones">—</div></div>
</section>

<section class="panel">
<h2>Inventario y trazabilidad</h2>
<div class="tools"><input id="buscar" placeholder="Buscar por código de botella…"><button onclick="cargar()">Actualizar</button></div>
<div class="status" id="estado">Conectando con Supabase…</div>
<div class="tablewrap"><table><thead><tr><th>Botella</th><th>Producto</th><th>Lote</th><th>Estado</th><th>Usuario</th><th>Interacciones</th><th>Devolución</th><th>Puntos</th></tr></thead><tbody id="tabla"></tbody></table></div>
</section>

<section class="panel">
<h2>Últimas interacciones</h2>
<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Botella</th><th>Acción</th><th>Usuario</th></tr></thead><tbody id="interacciones"></tbody></table></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://igfjlxikvcdzrkithwrc.supabase.co';
const SUPABASE_KEY='sb_publishable_T8bVVgFPqp9fOE-usb2MYQ_et1O2elh';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function fecha(v){return v?new Date(v).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'}):'—';}

async function cargar(){
 const estado=document.getElementById('estado');
 estado.className='status'; estado.textContent='Cargando datos…';
 const [{data:b,error:be},{data:i,error:ie},{data:d,error:de}]=await Promise.all([
   db.from('botellas').select('id,codigo,estado,usuario_id,producto_id,productos(nombre,lote)').order('id'),
   db.from('interacciones').select('id,botella_id,usuario_id,accion,fecha').order('fecha',{ascending:false}).limit(100),
   db.from('devoluciones').select('id,botella_id,usuario_id,puntos,beneficio,fecha').order('fecha',{ascending:false})
 ]);
 if(be||ie||de){estado.className='error';estado.textContent='No se pudieron cargar los datos: '+(be?.message||ie?.message||de?.message);return;}
 const inter=i||[], dev=d||[], bots=b||[];
 const q=document.getElementById('buscar').value.trim().toUpperCase();
 const visibles=bots.filter(x=>!q||x.codigo.toUpperCase().includes(q));
 document.getElementById('nBotellas').textContent=bots.length;
 document.getElementById('nAsociadas').textContent=bots.filter(x=>x.usuario_id).length;
 document.getElementById('nInteracciones').textContent=inter.length;
 document.getElementById('nDevoluciones').textContent=dev.length;

 document.getElementById('tabla').innerHTML=visibles.map(x=>{
   const ii=inter.filter(z=>z.botella_id===x.id);
   const dd=dev.find(z=>z.botella_id===x.id);
   return `<tr><td><strong>${esc(x.codigo)}</strong></td><td>${esc(x.productos?.nombre||'—')}</td><td>${esc(x.productos?.lote||'—')}</td><td><span class="badge">${esc(x.estado)}</span></td><td>${x.usuario_id?esc(x.usuario_id):'—'}</td><td>${ii.length}</td><td>${dd?'Sí':'No'}</td><td>${dd?.puntos||0}</td></tr>`;
 }).join('')||'<tr><td colspan="8" class="empty">No hay botellas que coincidan.</td></tr>';

 document.getElementById('interacciones').innerHTML=inter.slice(0,30).map(x=>`<tr><td>${fecha(x.fecha)}</td><td>${esc(bots.find(z=>z.id===x.botella_id)?.codigo||x.botella_id)}</td><td>${esc(x.accion)}</td><td>${x.usuario_id?esc(x.usuario_id):'Anónimo'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Todavía no hay interacciones.</td></tr>';
 estado.textContent=`Actualizado · ${new Date().toLocaleTimeString('es-CO')}`;
}
document.getElementById('buscar').addEventListener('input',cargar);
cargar();
</script>
</body></html>
